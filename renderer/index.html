<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agritech - Agricultural Research & Lab LIMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">
    <!-- APP CONTAINER -->
    <div class="app-container">
        
        <!-- SIDEBAR NAVIGATION -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>Agritech</h1>
                    <span>Research Suite v1.0</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="dashboard">
                    <span class="nav-icon" data-icon="dashboard"></span>
                    <span class="nav-label">Dashboard</span>
                </button>
                <button class="nav-item" data-view="projects">
                    <span class="nav-icon" data-icon="projects"></span>
                    <span class="nav-label">Projects</span>
                </button>
                
                <div class="nav-group-title">Research Modules</div>
                
                <button class="nav-item" data-view="hydroponics">
                    <span class="nav-icon" data-icon="hydroponics"></span>
                    <span class="nav-label">Hydroponics</span>
                </button>
                <button class="nav-item" data-view="irrigation">
                    <span class="nav-icon" data-icon="irrigation"></span>
                    <span class="nav-label">Irrigation</span>
                </button>
                <button class="nav-item" data-view="soil">
                    <span class="nav-icon" data-icon="soil"></span>
                    <span class="nav-label">Soil Quality</span>
                </button>
                <button class="nav-item" data-view="microgreens">
                    <span class="nav-icon" data-icon="microgreens"></span>
                    <span class="nav-label">Microgreens</span>
                </button>
                <button class="nav-item" data-view="water_analysis">
                    <span class="nav-icon" data-icon="water_analysis"></span>
                    <span class="nav-label">Water Analysis</span>
                </button>
                
                <div class="nav-group-title">Tools & Reports</div>
                
                <button class="nav-item" data-view="analytics">
                    <span class="nav-icon" data-icon="analytics"></span>
                    <span class="nav-label">Analytics</span>
                </button>
                <button class="nav-item" data-view="reports">
                    <span class="nav-icon" data-icon="reports"></span>
                    <span class="nav-label">Reports</span>
                </button>
                <button class="nav-item" data-view="gallery">
                    <span class="nav-icon" data-icon="gallery"></span>
                    <span class="nav-label">Gallery</span>
                </button>
                <button class="nav-item" data-view="templates">
                    <span class="nav-icon" data-icon="templates"></span>
                    <span class="nav-label">Templates</span>
                </button>
                <button class="nav-item" data-view="settings">
                    <span class="nav-icon" data-icon="settings"></span>
                    <span class="nav-label">Settings</span>
                </button>
            </nav>
        </aside>

        <!-- MAIN LAYOUT -->
        <main class="main-layout">
            <!-- TOP TOOLBAR -->
            <header class="toolbar">
                <div class="toolbar-left">
                    <div class="search-box">
                        <span class="search-icon">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </span>
                        <input type="text" id="global-search" placeholder="Search projects, experiments, tasks...">
                    </div>
                </div>
                <div class="toolbar-right">
                    <button class="btn btn-sm btn-primary" id="btn-quick-new" title="Create New Element">
                        <span class="icon-plus"></span> New
                    </button>
                    <button class="btn-icon" id="btn-quick-save" title="Save All Active Data">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                    </button>
                    <button class="btn-icon" id="btn-quick-export" title="Export Current View">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </button>
                    <button class="btn-icon" id="btn-quick-backup" title="Create Backup">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                        </svg>
                    </button>
                    <div class="notification-badge-container">
                        <button class="btn-icon" id="btn-toggle-notifications" title="View Notifications">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                            </svg>
                            <span class="badge hidden" id="notification-count">0</span>
                        </button>
                    </div>
                    <div class="user-profile-widget" id="user-profile-trigger" title="User Management & Settings">
                        <div class="user-avatar" id="header-user-avatar">R</div>
                        <span class="user-name" id="header-user-name">Researcher</span>
                    </div>
                </div>
            </header>

            <!-- MAIN VIEW CONTAINER (Dynamic Injection) -->
            <div class="view-viewport" id="view-viewport">
                <!-- Views will be dynamically loaded here by app.js -->
            </div>
        </main>

        <!-- NOTIFICATION DRAWER -->
        <div class="notification-drawer glass hidden" id="notification-drawer">
            <div class="drawer-header">
                <h3>Notifications & Alerts</h3>
                <button class="btn-icon-sm" id="close-notification-drawer">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="drawer-body" id="notification-drawer-body">
                <!-- Notifications list -->
            </div>
            <div class="drawer-footer">
                <button class="btn btn-sm btn-secondary w-100" id="btn-clear-notifications">Dismiss All</button>
            </div>
        </div>

    </div>

    <!-- GLOBAL DIALOG MODAL -->
    <div class="modal-backdrop hidden" id="global-modal">
        <div class="modal-window glass">
            <div class="modal-header">
                <h3 id="modal-title">Create New</h3>
                <button class="modal-close-btn" id="btn-close-modal">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body" id="modal-body-content">
                <!-- Form fields injected here -->
            </div>
            <div class="modal-footer" id="modal-footer-actions">
                <!-- Actions -->
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/icons.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
